<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📰 分辨真假資訊 — 學階2 課題1</title>
  <style>
    :root {
      --primary: #4A90D9;
      --success: #52C41A;
      --danger: #FF4D4F;
      --bg: #F0F4FF;
      --card-bg: #FFFFFF;
      --text: #333;
      --shadow: 0 4px 16px rgba(74,144,217,0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    /* Header */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .header p {
      font-size: 1rem;
      color: #666;
    }
    .badge {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }
    /* Progress Bar */
    .progress-wrap {
      width: 100%;
      max-width: 600px;
      margin-bottom: 20px;
    }
    .progress-label {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .progress-bar {
      height: 12px;
      background: #E8F0FE;
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #7FBFFFF);
      border-radius: 6px;
      transition: width 0.4s ease;
      width: 0%;
    }
    /* News Card */
    .card-container {
      perspective: 1000px;
      width: 100%;
      max-width: 600px;
      min-height: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .news-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      width: 100%;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.6s;
      position: relative;
      transform-style: preserve-3d;
    }
    .news-card.flip {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      backface-visibility: hidden;
    }
    .card-back {
      transform: rotateY(180deg);
    }
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      transition: opacity 0.3s;
    }
    .card-front { opacity: 1; }
    .card-back  { opacity: 0; background: var(--card-bg); }
    .news-icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
    }
    .news-source {
      font-size: 0.8rem;
      color: #999;
      margin-bottom: 8px;
    }
    .news-headline {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .news-content {
      font-size: 0.95rem;
      color: #555;
      text-align: center;
      line-height: 1.7;
    }
    .tag {
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .tag-true  { background: #E6F7D9; color: var(--success); }
    .tag-fake  { background: #FFF1F0; color: var(--danger); }
    .tag-unknown { background: #FFF7E6; color: #FA8C16; }
    .verdict-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }
    .verdict-text {
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .verdict-detail {
      font-size: 0.9rem;
      color: #666;
      text-align: center;
      line-height: 1.6;
      background: #F9FBFF;
      padding: 12px 16px;
      border-radius: 12px;
      border-left: 4px solid var(--primary);
    }
    /* Buttons */
    .btn-group {
      display: flex;
      gap: 16px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }
    .btn:active { transform: translateY(0); }
    .btn-true {
      background: var(--success);
      color: #fff;
    }
    .btn-fake {
      background: var(--danger);
      color: #fff;
    }
    .btn-next {
      background: var(--primary);
      color: #fff;
      display: none;
    }
    .btn-next.show { display: flex; align-items: center; gap: 8px; }
    .btn-restart {
      background: #fff;
      border: 2px solid var(--primary);
      color: var(--primary);
    }
    /* Feedback Flash */
    .feedback-flash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .feedback-flash.correct {
      background: rgba(82,196,26,0.25);
      opacity: 1;
      animation: flashFade 0.8s forwards;
    }
    .feedback-flash.wrong {
      background: rgba(255,77,79,0.25);
      opacity: 1;
      animation: flashFade 0.8s forwards;
    }
    @keyframes flashFade {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; }
    }
    .feedback-flash .flash-text {
      font-size: 3rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    /* Score */
    .score-panel {
      display: flex;
      gap: 24px;
      margin-top: 16px;
      font-size: 0.9rem;
      color: #666;
    }
    .score-panel span { font-weight: 700; }
    .score-true span { color: var(--success); }
    .score-fake span { color: var(--danger); }
    /* Hint */
    .hint-box {
      background: #FFF7E6;
      border-left: 4px solid #FA8C16;
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: #7A5011;
      line-height: 1.5;
      max-width: 600px;
      display: none;
    }
    /* Complete Screen */
    .complete-screen {
      text-align: center;
      padding: 40px 20px;
    }
    .complete-screen .trophy { font-size: 5rem; margin-bottom: 16px; }
    .complete-screen h2 { font-size: 1.5rem; color: var(--primary); margin-bottom: 8px; }
    .complete-screen p { color: #666; margin-bottom: 20px; }
    .complete-screen .stars { font-size: 2.5rem; margin-bottom: 20px; }
    .complete-screen .result-row {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 24px;
    }
    .complete-screen .result-item { text-align: center; }
    .complete-screen .result-item .num {
      font-size: 2rem;
      font-weight: 900;
    }
    .complete-screen .result-item .label {
      font-size: 0.85rem;
      color: #888;
    }
    .result-item.correct .num { color: var(--success); }
    .result-item.wrong .num { color: var(--danger); }

    /* Start Screen */
    .start-screen {
      text-align: center;
      padding: 40px 20px;
      max-width: 500px;
    }
    .start-screen .emoji-header { font-size: 4.5rem; margin-bottom: 16px; }
    .start-screen h2 { font-size: 1.6rem; color: var(--primary); margin-bottom: 12px; }
    .start-screen p { color: #666; line-height: 1.7; margin-bottom: 24px; font-size: 0.95rem; }
    .start-screen .btn-start {
      background: var(--primary);
      color: #fff;
      padding: 16px 48px;
      border: none;
      border-radius: 16px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }
    .start-screen .btn-start:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(74,144,217,0.3);
    }
    .learning-goals {
      background: #F0F4FF;
      border-radius: 12px;
      padding: 16px 20px;
      text-align: left;
      margin-bottom: 24px;
    }
    .learning-goals h3 { font-size: 0.9rem; color: var(--primary); margin-bottom: 8px; }
    .learning-goals ul { list-style: none; }
    .learning-goals li {
      font-size: 0.88rem;
      color: #555;
      padding: 4px 0;
      padding-left: 20px;
      position: relative;
    }
    .learning-goals li::before {
      content: '✅';
      position: absolute;
      left: 0;
    }
    /* Selection Screen */
    .selection-screen {
      text-align: center;
      padding: 30px 20px;
      max-width: 600px;
      width: 100%;
    }
    .selection-screen h2 {
      font-size: 1.4rem;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .selection-screen > p {
      color: #666;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .stage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .stage-btn {
      background: var(--card-bg);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 16px 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .stage-btn:hover {
      background: var(--primary);
      color: #fff;
      transform: translateY(-2px);
    }
    .stage-btn .stage-num {
      font-size: 1.5rem;
      font-weight: 900;
      display: block;
    }
    .stage-btn .stage-desc {
      font-size: 0.75rem;
      color: #888;
      margin-top: 4px;
    }
    .stage-btn:hover .stage-desc { color: #ddd; }
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .topic-btn {
      background: var(--card-bg);
      border: 2px solid #E8F0FE;
      border-radius: 10px;
      padding: 12px 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .topic-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #F0F4FF;
      transform: translateY(-1px);
    }
    .topic-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .topic-btn .topic-num {
      font-size: 1.1rem;
      font-weight: 700;
      display: block;
    }
    .topic-btn .topic-tag {
      font-size: 0.7rem;
      color: #888;
      margin-top: 2px;
    }
    .btn-confirm {
      background: var(--primary);
      color: #fff;
      padding: 14px 40px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      display: none;
    }
    .btn-confirm.show { display: inline-block; }
    .btn-confirm:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(74,144,217,0.3); }
    /* Clue Panel */
    .clue-panel {
      background: linear-gradient(135deg, #FFF7E6 0%, #FFF3CC 100%);
      border: 2px solid #FA8C16;
      border-radius: 12px;
      padding: 14px 18px;
      margin: 12px 0;
      text-align: left;
      display: none;
      width: 100%;
    }
    .clue-panel.show { display: block; }
    .clue-panel .clue-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #7A3E00;
      margin-bottom: 6px;
    }
    .clue-panel .clue-text {
      font-size: 0.85rem;
      color: #5C2C00;
      line-height: 1.5;
    }
    /* Investigation Button */
    .btn-investigate {
      background: #FA8C16;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      margin-top: 8px;
    }
    .btn-investigate:hover {
      background: #E67700;
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(250,140,22,0.3);
    }
  </style>
</head>

<!-- Header -->

      <p id="complete-msg"></p>
      <button class="btn btn-restart" id="btn-restart">再玩一次 🔄</button>
    </div>
  </div>
</div>

<!-- Feedback Flash -->
<div class="feedback-flash" id="feedback-flash">
  <div class="flash-text" id="flash-text"></div>
</div>

const STAGES = [
  { num: 1, desc: '小一至小二', topics: ['課題1','課題2','課題3','課題4','課題5','課題6','課題7','課題8'] },
  { num: 2, desc: '小三至小四', topics: ['課題1','課題2','課題3','課題4','課題5','課題6','課題7','課題8'] },
  { num: 3, desc: '小五', topics: ['課題1','課題2','課題3','課題4','課題5','課題6','課題7','課題8'] },
  { num: 4, desc: '小六', topics: ['課題1','課題2','課題3','課題4','課題5','課題6','課題7','課題8'] },
  { num: 5, desc: '初中', topics: ['課題1','課題2','課題3','課題4','課題5','課題6','課題7','課題8'] }
];

// ─── State ─────────────────────────────────────────────
let currentIndex = 0;
let scoreCorrect = 0;
let scoreWrong = 0;
let answered = false;
let investigated = false;
let selectedStage = null;
let selectedTopic = null;
let ttsQueue = [];

// ─── DOM Elements ─────────────────────────────────────
const startScreen    = document.getElementById('start-screen');
const selectionScreen = document.getElementById('selection-screen');
const questionScreen  = document.getElementById('question-screen');
const completeScreen = document.getElementById('complete-screen');
const newsCard        = document.getElementById('news-card');
const btnGroup        = document.getElementById('btn-group');
const btnNext         = document.getElementById('btn-next');
const hintBox         = document.getElementById('hint-box');
const progressFill    = document.getElementById('progress-fill');
const progressText    = document.getElementById('progress-text');
const feedbackFlash   = document.getElementById('feedback-flash');
const flashText       = document.getElementById('flash-text');

// Hidden audio for MiniMax TTS
let ttsAudio = document.createElement('audio');
ttsAudio.id = 'tts-audio';
ttsAudio.style.display = 'none';
document.body.appendChild(ttsAudio);

// ─── MiniMax TTS ────────────────────────────────────────
async function speak(text) {
  ttsQueue.push(text);
  processTTSQueue();
}

let ttsProcessing = false;
async function processTTSQueue() {
  if (ttsProcessing || ttsQueue.length === 0) return;
  ttsProcessing = true;
  const text = ttsQueue.shift();
  try {
    const media = await text_to_speech(text);
    if (media && media.startsWith('MEDIA:')) {
      const path = media.slice(6);
      ttsAudio.src = path;
      ttsAudio.play().catch(() => {});
      ttsAudio.onended = () => { ttsProcessing = false; processTTSQueue(); };
    } else {
      ttsProcessing = false;
      processTTSQueue();
    }
  } catch (e) {
    ttsProcessing = false;
    processTTSQueue();
  }
}

// ─── Render Stage/Topic Selection ──────────────────────
function renderSelection() {
  const stageGrid = document.getElementById('stage-grid');
  stageGrid.innerHTML = '';
  STAGES.forEach(stage => {
    const btn = document.createElement('button');
    btn.className = 'stage-btn';
    btn.innerHTML = `<span class="stage-num">學階${stage.num}</span><span class="stage-desc">${stage.desc}</span>`;
    btn.addEventListener('click', () => selectStage(stage.num));
    stageGrid.appendChild(btn);
  });
}

function selectStage(num) {
  selectedStage = num;
  selectedTopic = null;
  document.getElementById('selection-title').textContent = `學階 ${num} — 請選擇課題`;
  const stageGrid = document.getElementById('stage-grid');
  stageGrid.querySelectorAll('.stage-btn').forEach(b => {
    b.style.background = b.textContent.includes(num) ? 'var(--primary)' : '';
    b.style.color = b.textContent.includes(num) ? '#fff' : '';
  });
  const topicGrid = document.getElementById('topic-grid');
  topicGrid.style.display = 'grid';
  topicGrid.innerHTML = '';
  STAGES[num - 1].topics.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn';
    btn.innerHTML = `<span class="topic-num">${t}</span><span class="topic-tag">click</span>`;
    btn.addEventListener('click', () => selectTopic(i + 1));
    topicGrid.appendChild(btn);
  });
  document.getElementById('btn-confirm').classList.remove('show');
}

function selectTopic(num) {
  selectedTopic = num;
  document.querySelectorAll('.topic-btn').forEach((b, i) => {
    b.style.borderColor = (i === num - 1) ? 'var(--primary)' : '#E8F0FE';
    b.style.background = (i === num - 1) ? '#F0F4FF' : '';
  });
  document.getElementById('btn-confirm').classList.add('show');
  // Save to localStorage
  localStorage.setItem('discern_stage', selectedStage);
  localStorage.setItem('discern_topic', selectedTopic);
}

// ─── Render Question ───────────────────────────────────
function renderQuestion() {
  const q = QUESTIONS[currentIndex];
  document.getElementById('news-icon').textContent = q.icon;
  document.getElementById('news-source').textContent = q.source;
  document.getElementById('tag-question').textContent = '❓ 等待你判斷';
  document.getElementById('tag-question').className = 'tag tag-unknown';
  document.getElementById('news-headline').textContent = q.headline;
  document.getElementById('news-content').textContent = q.content;
  document.getElementById('verdict-icon').textContent = q.isTrue ? '✅' : '❌';
  document.getElementById('verdict-tag').textContent = q.isTrue ? '✅ 真新聞' : '❌ 假資訊';
  document.getElementById('verdict-tag').className = 'tag ' + (q.isTrue ? 'tag-true' : 'tag-fake');
  document.getElementById('verdict-text').textContent = q.isTrue ? '這是真的新聞！' : '這是假資訊！';
  document.getElementById('verdict-detail').textContent = q.reason;
  hintBox.textContent = q.hint;
  hintBox.style.display = 'none';

  // Reset card
  newsCard.classList.remove('flip');
  btnGroup.style.display = 'none';
  btnNext.classList.remove('show');
  investigated = false;
  document.getElementById('btn-investigate').style.display = 'inline-block';
  document.getElementById('clue-panel').classList.remove('show');

  // Progress
  progressFill.style.width = (currentIndex / QUESTIONS.length * 100) + '%';
  progressText.textContent = currentIndex + ' / ' + QUESTIONS.length;

  answered = false;
}

// ─── Handle Investigation (Clue-first) ────────────────
document.getElementById('btn-investigate').addEventListener('click', () => {
  if (investigated) return;
  investigated = true;
  const q = QUESTIONS[currentIndex];
  document.getElementById('clue-title').textContent = '🔍 來源線索';
  document.getElementById('clue-text').textContent = q.clue;
  document.getElementById('clue-panel').classList.add('show');
  document.getElementById('btn-investigate').style.display = 'none';
  // Now show 真/假 buttons
  btnGroup.style.display = 'flex';
  speak('留意吓呢個資訊嘅來源，再做判斷！');
});

// ─── Handle Answer ────────────────────────────────────
function handleAnswer(userChoice) {
  if (answered) return;
  answered = true;

  const q = QUESTIONS[currentIndex];
  const correct = (userChoice === 'true') === q.isTrue;

  // Flash
  feedbackFlash.className = 'feedback-flash ' + (correct ? 'correct' : 'wrong');
  flashText.textContent = correct ? '🎉 答啱！' : '😯 答錯了！';
  setTimeout(() => { feedbackFlash.className = 'feedback-flash'; }, 850);

  // Speech
  if (correct) {
    speak('答啱！你好叻！');
    scoreCorrect++;
    document.getElementById('score-correct').textContent = scoreCorrect;
  } else {
    speak('答錯了，唔緊要，再試過！');
    scoreWrong++;
    document.getElementById('score-wrong').textContent = scoreWrong;
  }

  // Flip card
  newsCard.classList.add('flip');

  // Show hint
  hintBox.style.display = 'block';

  // Toggle buttons
  btnGroup.style.display = 'none';

  const isLast = currentIndex >= QUESTIONS.length - 1;
  if (isLast) {
    btnNext.textContent = '睇結果 🏆';
  } else {
    btnNext.textContent = '下一題 ➡️';
  }
  btnNext.classList.add('show');

  // Update progress to current
  progressFill.style.width = ((currentIndex + 1) / QUESTIONS.length * 100) + '%';
  progressText.textContent = (currentIndex + 1) + ' / ' + QUESTIONS.length;
}

// ─── Show Complete ─────────────────────────────────────
function showComplete() {
  questionScreen.style.display = 'none';
  completeScreen.style.display = 'block';

  const pct = scoreCorrect / QUESTIONS.length;
  let stars = '';
  if (pct == 1) stars = '⭐⭐⭐⭐⭐';
  else if (pct >= 0.8) stars = '⭐⭐⭐⭐';
  else if (pct >= 0.6) stars = '⭐⭐⭐';
  else if (pct >= 0.4) stars = '⭐⭐';
  else stars = '⭐';

  document.getElementById('stars').textContent = stars;
  document.getElementById('final-correct').textContent = scoreCorrect;
  document.getElementById('final-wrong').textContent = scoreWrong;

  if (pct == 1) {
    document.getElementById('complete-title').textContent = '完美！你係終極 Fact-Checker！🎉';
    document.getElementById('complete-msg').textContent = '你對所有資訊都分辨得非常清楚！';
    speak('太捧了，你是終極事實審查員！');
  } else if (pct >= 0.6) {
    document.getElementById('complete-title').textContent = '做得好！繼續努力！💪';
    document.getElementById('complete-msg').textContent = '記住：要查證消息，先確認，再分享！';
    speak('做得好！繼續努力！');
  } else {
    document.getElementById('complete-title').textContent = '再試多一次，你可以的！📰';
    document.getElementById('complete-msg').textContent = '記住：留意消息來源、有沒有研究證據、係咪太震驚！';
    speak('再試多一次，你可以的！');
  }
}

// ─── Event Listeners ───────────────────────────────────
document.getElementById('btn-start').addEventListener('click', () => {
  startScreen.style.display = 'none';
  selectionScreen.style.display = 'block';
  renderSelection();
});

document.getElementById('btn-confirm').addEventListener('click', () => {
  if (!selectedStage || !selectedTopic) return;
  selectionScreen.style.display = 'none';
  questionScreen.style.display = 'block';
  currentIndex = 0;
  scoreCorrect = 0;
  scoreWrong = 0;
  document.getElementById('score-correct').textContent = '0';
  document.getElementById('score-wrong').textContent = '0';
  // Update badge
  document.querySelector('.badge').textContent = `📚 學階${selectedStage} · 課題${selectedTopic}`;
  document.querySelector('.header h1').nextElementSibling.textContent = `課題${selectedTopic} — Learn to spot real vs. fake news!`;
  renderQuestion();
});

document.getElementById('btn-select-true').addEventListener('click', () => handleAnswer('true'));
document.getElementById('btn-select-fake').addEventListener('click', () => handleAnswer('false'));

btnNext.addEventListener('click', () => {
  const isLast = currentIndex >= QUESTIONS.length - 1;
  if (isLast) {
    showComplete();
  } else {
    currentIndex++;
    renderQuestion();
  }
});

document.getElementById('btn-restart').addEventListener('click', () => {
  completeScreen.style.display = 'none';
  startScreen.style.display = 'block';
  progressFill.style.width = '0%';
  progressText.textContent = '0 / 5';
  selectedStage = null;
  selectedTopic = null;
});
</script>
</body>
